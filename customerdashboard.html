<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link your existing stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart.js for graphs -->
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Customer Console</h2>
        <a href="profilesettings.html"><i class="fas fa-user-cog"></i> Profile Settings</a> <!-- Profile Settings icon -->
        <a href="manageusers.html"><i class="fas fa-users"></i> Manage Users</a> <!-- Manage Users icon -->
        <a href="manageservices.html"><i class="fas fa-cogs"></i> Manage Services</a> <!-- Manage Services icon -->
        <a href="tokenhistory.html"><i class="fas fa-history"></i> Token History</a> <!-- Token History icon -->
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Dashboard Overview</h1>

        <!-- Overview section with statistics -->
        <div class="overview">
            <div>
                <h3>Active Users</h3>
                <p id="active-users">50</p>
            </div>
            <div>
                <h3>Active Services</h3>
                <p id="active-services">10</p>
            </div>
            <div>
                <h3>Current Token Count</h3>
                <p id="current-token-count">200</p>
            </div>
        </div>

        <!-- Graphs Section -->
        <div class="overview-box">
            <h2 class="section-title">Graphs</h2>

            <div class="graphs">
                <div class="graph-container">
                    <div class="dropdowns">
                        <h3>Users vs Time:</h3>
                        <select id="usersTimeRange" onchange="updateUsersChart()">
                            <option value="current">Current</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last5days">Last 5 Days</option>
                            <option value="lastWeek">Last Week</option>
                            <option value="lastMonth">Last Month</option>
                        </select>
                    </div>
                    <canvas id="usersTimeChart"></canvas>
                </div>
            
                <div class="graph-container">
                    <div class="dropdowns">
                        <h3>Tokens vs Time:</h3>
                        <select id="tokensTimeRange" onchange="updateTokensChart()">
                            <option value="current">Current</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last5days">Last 5 Days</option>
                            <option value="lastWeek">Last Week</option>
                            <option value="lastMonth">Last Month</option>
                        </select>
                    </div>
                    <canvas id="tokensTimeChart"></canvas>
                </div>
            
                <div class="graph-container">
                    <div class="dropdowns">
                        <h3>Users vs Tokens:</h3>
                        <select id="usersTokensRange" onchange="updateUsersTokensChart()">
                            <option value="current">Current</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last5days">Last 5 Days</option>
                            <option value="lastWeek">Last Week</option>
                            <option value="lastMonth">Last Month</option>
                        </select>
                    </div>
                    <canvas id="usersTokensChart"></canvas>
                </div>
            </div>            
        </div>
    </div>

    <script>
        // Initial data for the charts
        let tokensTimeData = {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
            datasets: [{
                label: 'Tokens',
                data: [120, 150, 180, 220, 250],
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.2)',
                fill: true
            }]
        };

        let usersTimeData = {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
            datasets: [{
                label: 'Users',
                data: [30, 40, 50, 60, 70],
                borderColor: '#27ae60',
                backgroundColor: 'rgba(39, 174, 96, 0.2)',
                fill: true
            }]
        };

        let usersTokensData = {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
            datasets: [
                {
                    label: 'Users',
                    data: [30, 40, 50, 60, 70],
                    borderColor: '#27ae60',
                    backgroundColor: 'rgba(39, 174, 96, 0.2)',
                    fill: true
                },
                {
                    label: 'Tokens',
                    data: [120, 150, 180, 220, 250],
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.2)',
                    fill: true
                }
            ]
        };

        // Configurations for the charts
        const tokensTimeConfig = {
            type: 'line',
            data: tokensTimeData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    }
                }
            }
        };

        const usersTimeConfig = {
            type: 'line',
            data: usersTimeData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    }
                }
            }
        };

        const usersTokensConfig = {
            type: 'line',
            data: usersTokensData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true
                    }
                }
            }
        };

        // Render charts
        const tokensTimeCtx = document.getElementById('tokensTimeChart').getContext('2d');
        const usersTimeCtx = document.getElementById('usersTimeChart').getContext('2d');
        const usersTokensCtx = document.getElementById('usersTokensChart').getContext('2d');

        const tokensChart = new Chart(tokensTimeCtx, tokensTimeConfig);
        const usersChart = new Chart(usersTimeCtx, usersTimeConfig);
        const usersTokensChart = new Chart(usersTokensCtx, usersTokensConfig);

        // Update chart functions
        function updateTokensChart() {
            const selectedRange = document.getElementById('tokensTimeRange').value;
            // Update data based on selected time range
            tokensChart.data.datasets[0].data = [120, 150, 180, 220, 250]; // Replace with actual data based on selectedRange
            tokensChart.update();
        }

        function updateUsersChart() {
            const selectedRange = document.getElementById('usersTimeRange').value;
            // Update data based on selected time range
            usersChart.data.datasets[0].data = [30, 40, 50, 60, 70]; // Replace with actual data based on selectedRange
            usersChart.update();
        }

        function updateUsersTokensChart() {
            const selectedRange = document.getElementById('usersTokensRange').value;
            // Update data based on selected time range
            usersTokensChart.data.datasets[0].data = [30, 40, 50, 60, 70]; // Replace with actual data based on selectedRange
            usersTokensChart.data.datasets[1].data = [120, 150, 180, 220, 250]; // Replace with actual data based on selectedRange
            usersTokensChart.update();
        }
    </script>
</body>
</html>
